#!/usr/bin/env python3
PACKAGE = "limo_control"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()
gen.add("slope_max_deg",      double_t, 0, "Max allowed slope (deg)", 12.0, 5.0, 25.0)
gen.add("drop_height_min",    double_t, 0, "Min negative step to block (m)", 0.06, 0.01, 0.20)
gen.add("drop_gap_cells",     int_t,    0, "Consecutive empty cells to confirm drop", 3, 1, 10)
gen.add("look_ahead",         double_t, 0, "Forward look-ahead (m)", 1.2, 0.5, 3.0)
gen.add("overhead_clearance", double_t, 0, "Extra headroom needed (m)", 0.30, 0.10, 0.60)
gen.add("sync_slop",          double_t, 0, "ATS time sync slop (s)", 0.12, 0.02, 0.30)
gen.add("sample_limit",       int_t,    0, "Max sampled points for RANSAC", 12000, 1000, 60000)
gen.add("ransac_thresh",      double_t, 0, "RANSAC dist threshold (m)", 0.02, 0.005, 0.08)
gen.add("spd_alpha",          double_t, 0, "EWMA for speed_scale", 0.30, 0.05, 0.95)
exit(gen.generate(PACKAGE, "limo_control", "DepthHazard"))
